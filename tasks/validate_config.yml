---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "minecraft_container_publish_ports", "new": "<Removed>" }
    - { "old": "minecraft_container_publish_ports_default", "new": "<Removed>" }
    - { "old": "minecraft_container_publish_ports_additional", "new": "<Removed>" }
    - { "old": "minecraft_container_volumes", "new": "minecraft_container_additional_volumes" }
    - { "old": "minecraft_container_volumes_derived", "new": "minecraft_container_additional_volumes_auto" }
    - { "old": "minecraft_container_volumes_additional", "new": "minecraft_container_additional_volumes_custom" }
    - { "old": "minecraft_environment_variables", "new": "minecraft_environment_variables_additional_variables" }
    - { "old": "minecraft_environment_variables_default", "new": "<Removed>" }
    - { "old": "minecraft_environment_variables_derived", "new": "<Removed>" }
    - { "old": "minecraft_environment_variables_additional", "new": "<Removed>" }
    - { "old": "minecraft_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Minecraft Server settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - minecraft_identifier
    - minecraft_uid
    - minecraft_gid
    - minecraft_container_network

- name: Validate Minecraft Server security settings
  ansible.builtin.assert:
    that:
      - minecraft_security_mode == 'insecure' or
        (minecraft_security_privileged | bool == false and
         minecraft_security_write_access | bool == false and
         minecraft_security_allow_capabilities | length == 0)
    fail_msg: >-
      Before changing any of the `minecraft_security_` settings, please read
      the section on Security Settings in defaults/main.yml of the role, and
      set `minecraft_security_mode` to `insecure` to acknowledge the risks.

- name: Validate Minecraft Server web interface settings
  when: minecraft_web_interfaces | length > 0
  block:
    - name: Validate that each web interface has a name, hostname and port
      ansible.builtin.assert:
        that:
          - item.name is defined and item.name | string | length > 0
          - item.hostname is defined and item.hostname | string | length > 0
          - item.port is defined and item.port | int > 0
        fail_msg: >-
          Each entry in `minecraft_web_interfaces` needs a non-empty `name` and
          `hostname`, and a positive `port` (invalid entry: {{ item }}).
        quiet: true
      loop: "{{ minecraft_web_interfaces }}"
      loop_control:
        label: "{{ item.name | default('<unnamed>') }}"

    - name: Validate that web interface names are unique
      ansible.builtin.assert:
        that:
          - minecraft_web_interfaces | map(attribute='name') | list | length == minecraft_web_interfaces | map(attribute='name') | unique | list | length
        fail_msg: >-
          The names in `minecraft_web_interfaces` must be unique, because they
          are used to build the Traefik router and service names.
        quiet: true

    - name: Validate the Traefik settings used for the web interfaces
      when: minecraft_container_labels_traefik_enabled | bool
      ansible.builtin.assert:
        that:
          - minecraft_container_labels_traefik_docker_network | string | length > 0
          - minecraft_container_labels_traefik_entrypoints | string | length > 0
        fail_msg: >-
          When `minecraft_web_interfaces` is set, both
          `minecraft_container_labels_traefik_docker_network` and
          `minecraft_container_labels_traefik_entrypoints` need to be set.
        quiet: true
